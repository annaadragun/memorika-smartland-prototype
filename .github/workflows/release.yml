name: Create GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged version
        uses: actions/checkout@v6

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Smartland Academy $GITHUB_REF_NAME" \
            --generate-notes \
            --notes $'Current live site: https://annaadragun.github.io/memorika-smartland-prototype/\n\nThe ZIP and TAR archives below preserve the repository exactly as it was at this release tag.'
