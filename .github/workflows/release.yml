name: Create GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: version-publishing
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged version
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Smartland Academy $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Versioned live preview: https://annaadragun.github.io/memorika-smartland-prototype/versions/$GITHUB_REF_NAME/

          Latest live site: https://annaadragun.github.io/memorika-smartland-prototype/

          The ZIP and TAR archives below preserve the repository exactly as it was at this release tag."

      - name: Register version for GitHub Pages
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          git fetch origin main
          git switch --force-create main origin/main

          if ! grep -Fxq "$TAG_NAME" .github/published-version-tags.txt 2>/dev/null; then
            printf '%s\n' "$TAG_NAME" >> .github/published-version-tags.txt
          fi

          git add .github/published-version-tags.txt
          if git diff --cached --quiet; then
            echo "$TAG_NAME is already registered."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Register ${TAG_NAME} for Pages preview"
          git push origin main
