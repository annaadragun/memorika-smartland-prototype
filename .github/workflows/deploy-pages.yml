name: Deploy prototype to GitHub Pages

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Assemble latest and tagged versions
        run: |
          mkdir -p public/versions
          cp -R src/. public/

          for tag in $(git tag --list 'v*' --sort=version:refname); do
            mkdir -p "public/versions/$tag"
            git archive --format=tar "$tag" src/ | \
              tar -x --strip-components=1 -C "public/versions/$tag"
          done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
